services:
  # ----------------------------------------------------------------
  # INFRAESTRUTURA (Banco de Dados)
  # ----------------------------------------------------------------
  postgresql-db:
    image: postgres:16-alpine
    container_name: postgres-db-homolog
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: registro_receitas_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-homolog-data:/var/lib/postgresql/data
    networks:
      - rede-homolog
    restart: always

  # ----------------------------------------------------------------
  # APLICAÇÃO
  # ----------------------------------------------------------------
  application-server:
    image: registro-receitas-image
    container_name: application-server-homolog
    environment:
      SERVER_ADDRESS: 0.0.0.0 # Ouvindo internamente o container
      SERVER_PORT: 80
      DB_HOST: postgresql-db
      DB_USER: postgres
      DB_PASS: postgres
      EMAIL_HOST: smtp.gmail.com
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    ports:
      - "8081:80"
    depends_on:
      - postgresql-db
    networks:
      - rede-homolog
    restart: always

# ----------------------------------------------------------------
# REDES E VOLUMES
# ----------------------------------------------------------------
networks:
  rede-homolog:
    driver: bridge

volumes:
  postgres-homolog-data: # Para os dados do banco não sumirem se desligar a VM